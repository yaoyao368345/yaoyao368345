name: Profile banner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/build-banner.sh"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/profile-banner.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/build-banner.sh"
      - "assets/**"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/profile-banner.yml"

permissions:
  contents: read

concurrency:
  group: profile-banner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install, test, render and validate
        run: bash scripts/build-banner.sh
      - name: Verify deterministic rebuild
        run: |
          sha256sum assets/profile-banner.{svg,png,gif} > "$RUNNER_TEMP/banner-checksums"
          npm run build
          sha256sum --check "$RUNNER_TEMP/banner-checksums"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-banner
          path: |
            assets/profile-banner.svg
            assets/profile-banner.png
            assets/profile-banner.gif
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Check for a newer main commit
        id: current
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$BUILD_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.current.outputs.publish == 'true'
        with:
          name: profile-banner
          path: assets
      - name: Commit changed assets only
        if: steps.current.outputs.publish == 'true'
        run: |
          git add -- assets/profile-banner.svg assets/profile-banner.png assets/profile-banner.gif
          if git diff --cached --quiet; then
            echo 'Generated assets are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate profile banner [skip ci]'
          git push origin HEAD:main
